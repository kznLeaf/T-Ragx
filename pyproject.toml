[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "t-ragx"
version = "0.1.2"
description = "Enhancing translation with RAG-powered large language models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.12"
authors = [{ name = "Ray Liu", email = "ray@rayliu.ca" }]
keywords = [
    "machine-translation",
    "computer-aided-translation",
    "computer-assisted-translation",
    "rag",
    "retrieval-augmented-generation",
    "large-language-models",
    "llm",
]
dependencies = [
    "python-dotenv>=0.5.1",
    "torch==2.1.1",
    "torchvision",
    "torchaudio",
    "elasticsearch>=7.9.1",
    "transformers~=4.38.1",
    "llama-cpp-python==0.2.54",
    "openai~=1.13.3",
    "unbabel-comet>=2.2.1",
    "bitsandbytes>=0.41.3.post2; sys_platform == 'linux'",
    "fasttext-wheel>=0.9.2",
    "datasets==2.13.1",
    "pyarrow>=12,<15",
    "fsspec==2023.9.2",
    "jinja2~=3.1.2",
    "tqdm~=4.65.0",
    "levenshtein~=0.23.0",
    "scipy",
    "evaluate",
    "peft",
    "accelerate",
    "pandas",
    "protobuf",
    "OpenCC",
    "fugashi[unidic_lite]",
    "sacrebleu[ja]",
    "numpy>=1.22.2",
    "setuptools<82",
]

[project.optional-dependencies]
dev = ["black", "flake8"]

[project.urls]
Homepage = "https://github.com/rayliuca/T-Ragx"
Repository = "https://github.com/rayliuca/T-Ragx"
"Bug Tracker" = "https://github.com/rayliuca/T-Ragx/issues"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["black", "flake8", "ruff"]

[tool.ruff.lint.per-file-ignores]
# Legacy PascalCase module filenames kept for import compatibility.
"src/t_ragx/models/*.py" = ["N999"]
"src/t_ragx/processors/*.py" = ["N999"]

